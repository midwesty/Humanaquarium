 case'crayons':g.fillStyle='#E05A47';g.fillRect(x,y-1,5,1.5);g.fillStyle='#4CC9F0';g.fillRect(x,y+1,5,1.5);break;

 try{for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(!bigKey(k))continue;const v=localStorage.getItem(k);if(v==null)continue;

function oxPersonHTML(p){let h='';const o=p.outfit&&OX(p.outfit);if(o)h+=`<p class="small"><b>${rankOf(p)}</b> in <span style="color:${o.color}">${esc(o.name)}</span>${o.boss===p.id?'':', under '+(bossOf(o)?plink(o.boss):'nobody')}.${p.informant?' <span class="warn">Secretly talking to detectives.</span>':''}</p>`;
 if(p.shark){const so=OX(p.shark.o);h+=`<p class="small"><b>Owes $${p.shark.owed.toLocaleString()}</b> to ${so?esc(so.name):'a loan shark'}${p.shark.missed?', behind on '+p.shark.missed+' payment'+(p.shark.missed===1?'':'s'):''}. Interest is 10% a week.</p>`;}
 if(p.onTake){const co=OX(p.onTake);h+=`<p class="small warn">On ${co?esc(co.name):'an outfit'}’s payroll.</p>`;}
 if((p.dep.drugs||0)>10)h+=`<p class="small">Drugs: ${Math.round(p.dep.drugs)}% dependent${p.quitting.drugs?', trying to quit':''}.</p>`;return h;}
function oxGodHTML(p){if(age(p)<16)return'';const B=(g,l,cls)=>`<button data-oxg="${g}"${cls?` class="${cls}"`:''}>${l}</button>`;return`<p class="small muted">Organized crime</p><div class="btnrow wrap">${adult(p)?B('boss','Make them a boss'):''}${p.outfit?B('flip','Make them an informant')+B('leave','Walk away from the outfit'):''}${adult(p)?B('shark','Borrow from a loan shark'):''}${p.job&&['pol_officer','pol_det','j_sheriff_s_deputy','j_judge'].includes(p.job.j)?B('corrupt','Put them on the take'):''}${B('calloff','Call off anything against them')}${murderOn()&&adult(p)?`<button data-act="god" data-g="hit" class="danger">Put out a hit on…</button>`:''}</div>`+joinPickHTML(p);}
function oxBizHTML(z){const parts=[];for(const o of outfits()){if(o.front===z.id)parts.push('A front for '+esc(o.name)+' (only you know)');if(o.turf.includes(z.id))parts.push('Pays protection to '+esc(o.name));}if(z.cameras)parts.push('Has security cameras');if(z.strikes)parts.push('Has refused to pay '+z.strikes+' time'+(z.strikes===1?'':'s'));return parts.length?`<p class="small">${parts.join('. ')}.</p>`:'';}
function oxBizGodHTML(z){const B=(g,l)=>`<button data-oxb="${g}">${l}</button>`;return(outfits().length?B('front','Make it a mob front')+B('protect','Put it under protection'):'')+B('rob','Have it robbed')+(z.cameras?'':B('cameras','Install security cameras'));}
Object.assign(TARGETED,{hit:'Tap the person to put a hit on. Only adults can be targeted.'});DANGER.push('hit');
{const _gd=godDone;godDone=function(g,a,p){if(g==='hit')return murderOn()&&adult(p)?'There’s a price on '+p.first+'’s head now.':'That can’t happen (murder is off, or they’re under 18).';return _gd(g,a,p);};}
body.addEventListener('click',e=>{const b=e.target.closest('button[data-oxg],button[data-oxt],button[data-oxb]');if(!b)return;e.stopPropagation();const v=stack[stack.length-1];
 if(b.dataset.oxg){const p=v&&v.type==='person'&&S.people[v.id];if(!p)return;toast(tn(OXGOD[b.dataset.oxg](p)));render();return;}
 if(b.dataset.oxt){const g=b.dataset.oxt;if(['war','fed','heist'].includes(g)&&!armed(b,'Tap again to confirm'))return;toast(tn(OXTOWN[g]()));render();return;}
 if(b.dataset.oxb){const z=v&&S.biz[v.id];if(!z)return;toast(tn(OXBIZ[b.dataset.oxb](z)));render();return;}},true);
function oxSettingsHTML(){if(!S||!S.cfg)return'';const c=oxCfg();return`<label class="tog"><input type="checkbox" data-ox14s="outfits" ${c.outfits!==false?'checked':''}> Organized crime</label><p class="small muted">Rackets outfits can run:</p>`+Object.entries(DATA.rackets).map(([k,l])=>`<label class="tog"><input type="checkbox" data-ox14s="r:${k}" ${c.rackets[k]!==false?'checked':''}> ${esc(l)}</label>`).join('');}
body.addEventListener('change',e=>{const el=e.target.closest('[data-ox14s]');if(!el)return;e.stopPropagation();const c=oxCfg();const k=el.dataset.ox14s;if(k==='outfits')c.outfits=el.checked;else c.rackets[k.slice(2)]=el.checked;toast('Saved for this town.');},true);
/* ---- turf on the map ---- */
function drawTurf(){if(!SET.turf||!S.outfits)return;cx.save();cx.lineWidth=Math.max(1.5,2*cam.z);cx.setLineDash([5,4]);
 for(const o of outfits()){cx.strokeStyle=o.color;cx.fillStyle=o.color+'22';for(const id of o.turf.concat(o.front?[o.front]:[])){const b=S.blds[id];if(!b||!b.fp)continue;cx.beginPath();b.fp.forEach((pt,i)=>{const q=P2(pt[0],pt[1],0);if(i)cx.lineTo(q[0],q[1]);else cx.moveTo(q[0],q[1]);});cx.closePath();cx.fill();cx.stroke();}}
 cx.restore();}

/* ======================= v0.15: the alerts log, calmer pop-ups, live pages, jumpsuits, choosing an outfit ======================= */
function logAlert(e,fav){if(!S)return;S.alerts=S.alerts||[];S.alerts.push({t:S.t,text:e.text,ids:(e.ids||[]).slice(0,6),fav:!!fav,d:e.drama||0});if(S.alerts.length>500)S.alerts.splice(0,S.alerts.length-500);}
function hookSim(){S._favFamily=SET.passFav;S._onNews=e=>{const fav=e.ids.some(i=>S.people[i]&&S.people[i].fav);const pop=(fav&&e.drama>=2)||e.drama>=6;if(pop)logAlert(e,fav);if(busy)return;SND.event(e);if((fav&&SET.favToasts&&e.drama>=2)||(SET.bigToasts&&e.drama>=6))toast(plain(e.text));};
 S._onAlert=(t,ids)=>{logAlert({text:t,ids,drama:3},true);if(!busy&&SET.favToasts)toast(plain(t));};S._onDeath=p=>{if(!p.fav||!SET.passFav)return;const heirs=[p.partner,...p.children].map(i=>S.people[i]).filter(q=>q&&q.alive);heirs.forEach(q=>q.fav=true);if(heirs.length){const t='Now following '+heirs.map(q=>q.first).join(', ')+'.';logAlert({text:t,ids:heirs.map(q=>q.id),drama:3},true);if(!busy)toast(t);}};}
/* two pop-ups at a time; the rest wait behind a "more" button that opens the log */
let toastMore=0;
function toast(t){const box=$('#toasts');const live=[...box.querySelectorAll('.toast:not(.more):not(.out)')];announce(t);
 if(live.length>=2){toastMore++;let m=box.querySelector('.toast.more');if(!m){m=document.createElement('button');m.className='toast more';m.onclick=()=>{toastMore=0;m.remove();stack=[];openView('paper',{idx:S.paper.length,mode:'alerts'});};box.appendChild(m);}m.textContent='+'+toastMore+' more. Tap to see them in the paper’s Alerts.';clearTimeout(m._t);m._t=setTimeout(()=>{toastMore=0;m.remove();},7000);return;}
 const el=document.createElement('div');el.className='toast';el.textContent=tn(t);const m=box.querySelector('.toast.more');if(m)box.insertBefore(el,m);else box.appendChild(el);setTimeout(()=>el.classList.add('out'),reduce()?6200:6000);setTimeout(()=>el.remove(),6600);}
function alertsHTML(v){const A=(S.alerts||[]).slice().reverse();const f=v.af||'all';const L=f==='fav'?A.filter(a=>a.fav):A;
 let h=`<div class="chips ptopics"><button class="chip ${f==='all'?'on':''}" data-af="all">Everything</button><button class="chip ${f==='fav'?'on':''}" data-af="fav">Favorites only</button></div><p class="small muted">Every pop-up you’ve been sent, newest first, including the ones that went by while you were skipping ahead.</p>`;
 if(!L.length)return h+'<p class="empty">Nothing yet. Follow someone with the ☆ and you’ll hear about their life here.</p>';
 let last=null;for(const a of L.slice(0,200)){const d=Math.floor(a.t/1440);if(d!==last){h+=`<h3>${esc(dateLabel(d))}, ${DAYN[d%7]}</h3>`;last=d;}h+=`<div class="sres"><p><span class="muted small">${clock(a.t)}</span> ${a.fav?'★ ':''}${fmt(a.text)}</p></div>`;}return h;}
body.addEventListener('click',e=>{const b=e.target.closest('button[data-af]');if(!b)return;const v=stack[stack.length-1];if(!v||v.type!=='paper')return;e.stopPropagation();v.af=b.dataset.af;render();},true);
/* pages stay live: refresh unless someone is typing, and refresh the "why" and mood sections too */
function liveRefresh(v){const tmp=document.createElement('div');if(v.type==='person'){tmp.innerHTML=tn(personHTML(v.id));for(const id of['liveNow','liveNeeds']){const src=tmp.querySelector('#'+id),dst=body.querySelector('#'+id);if(src&&dst&&dst.innerHTML!==src.innerHTML)dst.innerHTML=src.innerHTML;}
  for(const k of['why','mood','crimerec']){const src=tmp.querySelector('details[data-k="'+k+'"] .sec'),dst=body.querySelector('details[data-k="'+k+'"] .sec');if(src&&dst&&dst.innerHTML!==src.innerHTML)dst.innerHTML=src.innerHTML;}
  const hs=tmp.querySelector('.pname .sub'),hd=body.querySelector('.pname .sub');if(hs&&hd&&hd.innerHTML!==hs.innerHTML)hd.innerHTML=hs.innerHTML;}
 else if(v.type==='building'){const b=S.blds[v.id];if(!b||['lot','site'].includes(b.use))return;const occ=(S._occ&&S._occ[v.id]||[]);const h=body.querySelector('#liveOccH');if(!h)return;const t='Inside now ('+occ.length+')';const list=occ.length?occ.map(p=>personRow(p)).join(''):'<p class="small muted">Nobody’s here right now.</p>';let box=body.querySelector('#liveOcc');if(!box){box=document.createElement('div');box.id='liveOcc';let n=h.nextSibling;while(n&&!(n.tagName==='H3')&&!(n.tagName==='DETAILS')){const nx=n.nextSibling;box.appendChild(n);n=nx;}h.after(box);}if(h.textContent!==t)h.textContent=t;if(box.innerHTML!==list)box.innerHTML=list;}}
function typing(){const a=document.activeElement;return!!(a&&body.contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName));}
/* choosing which outfit someone joins */
function joinPickHTML(p){const os=outfits();if(!os.length||p.outfit||age(p)<16)return'';const best=os.map(o=>[o,recruitScore(p,o)]).sort((a,b)=>b[1]-a[1])[0][0];
 return`<p class="small muted">Recruit into an outfit${os.length>1?' ('+esc(p.first)+' would lean toward '+esc(best.name)+')':''}</p><div class="btnrow wrap">${os.map(o=>`<button data-oxj="${o.id}"><span style="display:inline-block;width:9px;height:9px;border-radius:5px;background:${o.color};margin-right:5px"></span>${esc(cap(o.name))}</button>`).join('')}</div>`;}
body.addEventListener('click',e=>{const b=e.target.closest('button[data-oxj]');if(!b)return;e.stopPropagation();const v=stack[stack.length-1];const p=v&&v.type==='person'&&S.people[v.id];const o=OX(b.dataset.oxj);if(!p||!o)return;setRank(p,o,age(p)<20?'runner':'associate');logp(p,'Started doing jobs for '+o.name+'.');toast(tn(p.first+' is doing jobs for '+o.name+' now.'));render();},true);
(function(){const st=document.createElement('style');st.textContent='.toast.more{pointer-events:auto;cursor:pointer;font-weight:600;border:0;text-align:left;width:auto}';document.head.appendChild(st);})();

/* ======================= v0.16: emotes over heads, pins over buildings, rides with lights ======================= */
function drawEmote(s,p,rr){const ix=ixOf(p);if(!ix||cam.z<1)return;const fs=Math.round(9+cam.z*2.2);const y=s[1]-rr-(SET.figures&&cam.z>=2?22*cam.z*0.5:8)-fs*0.6;cx.font=fs+'px sans-serif';cx.textAlign='center';cx.fillStyle=TH.dark?'rgba(30,34,32,.85)':'rgba(255,255,255,.9)';cx.beginPath();cx.arc(s[0],y,fs*0.7,0,7);cx.fill();cx.fillStyle=TH.ink;cx.fillText(ix.emo,s[0],y+fs*0.35);cx.textAlign='left';}
function drawPins(){if(!S._pins||!S._pins.length)return;const t=animNow()/1000;for(const q of S._pins){if(q.until<S.t)continue;const b=S.blds[q.bid];if(!b||!b.fp)continue;const cxm=(b.fp[0][0]+b.fp[2][0])/2,cym=(b.fp[0][1]+b.fp[2][1])/2;const h=(b.floors||1)*12+14;const s=P2(cxm,cym,h);const fs=Math.round(11+cam.z*3);const bob=reduce()?0:Math.sin(t*3+q.t0)*2;
 cx.fillStyle=TH.dark?'rgba(30,34,32,.9)':'rgba(255,255,255,.95)';cx.strokeStyle='#D33A32';cx.lineWidth=2;cx.beginPath();cx.arc(s[0],s[1]-fs+bob,fs*0.8,0,7);cx.fill();cx.stroke();cx.font=fs+'px sans-serif';cx.textAlign='center';cx.fillStyle=TH.ink;cx.fillText(q.emo,s[0],s[1]-fs*0.62+bob);cx.textAlign='left';}}
function drawRide(xy,trip,rt,p){const pol=trip.mode==='police';drawCar(xy,trip,rt,{type:'sedan',color:pol?'#22355A':'#F2F2F2'},p);if(rt<trip.t1&&rt>=trip.t0&&Math.floor(animNow()/250)%2){const s=P2(xy[0],xy[1],4.6);cx.fillStyle=pol?'#3A6FD3':'#D33A32';cx.fillRect(s[0]-2,s[1]-1.2,4,2.4);}}
function dollBubble(g,x,y,emo,dark){const fs=Math.round(15*SET.text);g.fillStyle=dark?'rgba(30,34,32,.92)':'rgba(255,255,255,.96)';g.strokeStyle=dark?'#5A6460':'#B7BFB9';g.lineWidth=1;g.beginPath();if(g.roundRect)g.roundRect(x-fs*0.8,y-fs*1.05,fs*1.6,fs*1.35,6);else g.rect(x-fs*0.8,y-fs*1.05,fs*1.6,fs*1.35);g.fill();g.stroke();g.beginPath();g.moveTo(x-3,y+0.3*fs);g.lineTo(x,y+0.3*fs+5);g.lineTo(x+3,y+0.3*fs);g.fill();g.fillStyle=dark?'#E4EAE3':'#1F2A24';g.textAlign='center';g.font=fs+'px sans-serif';g.fillText(emo,x,y);}
function pairK(p){const ix=ixOf(p);return ix&&ix.w?(p.id<ix.w?p.id+'~'+ix.w:ix.w+'~'+p.id):p.id;}

/* ======================= v0.17 UI: grudges on the person page, big-name titles ======================= */
PFILT.push(['grudge','Holding a grudge',p=>!!(p.wr&&p.wr.length)],['bigname','Big names',p=>!!bigRole(p)]);
{const _ch=crimeHTML;crimeHTML=function(p){let h=_ch(p)||'';const role=bigRole(p);if(role)h=`<p class="small"><b>${DATA.bigRoles[role]}.</b> If anything happens to them, the whole town will hear about it.</p>`+h;
 const W=(p.wr||[]).filter(e=>S.people[e.by]);if(W.length){h+=`<p class="small"><b>Remembers:</b></p><ul class="small">`+W.map(e=>{const{q,st}=wrongOf(p,e);const w=q&&q.alive?revengeWant(p,e):-99;const mood=!q||!q.alive?'':q.inmate?' They’re locked up for now.':w>55?' <span class="warn">Wants payback.</span>':w>22?' Hasn’t let it go.':' Trying to move on.';
   return`<li>${plink(e.by)}, for ${esc(wrongText(e))} (Day ${e.d})${st==='acquitted'?', and walked free':st==='convicted'?', and was convicted':''}.${mood}</li>`;}).join('')+'</ul>';
  if(adult(p)||age(p)>=13)h+=`<div class="btnrow wrap"><button data-rvg="now" class="danger">Get even now</button><button data-rvg="forgive">Let it all go</button></div>`;}
 return h;};}
