 if(x.kind==='bird')return h>=7&&h<19?{k:'cage',label:awake.length?'Singing for the family':'Chirping at nobody',emo:'🎶'}:{k:'cage',label:'Asleep under its cover',emo:'💤'};

 if(a==='apply'){const p=S.people[CR.edit];if(p){applySpecToPerson(p,m);toast(fullName(p)+' has been updated.');}const id=CR.edit;CR=null;sheet.classList.remove('tall');stack=[];openPerson(id);return;}

function placeBld(where){const by=S._byUse;if(where==='homes')return null;if(where==='park')return(S.chunk.buildings.find(b=>b.use==='park')||{}).id||null;const list=by[where]||[];return list.find(id=>!S.biz[id]||S.biz[id].open)||list[0]||null;}
function calEvents(d){const out=[];const s=seasonOf(d),ds=dayOfSeason(d),wd=d%7,y=yearOf(d);
 for(const h of DATA.holidays)if(h.season===s&&holidayDay(h)===ds){const inf=DATA.holidayInfo[h.id]||{};out.push({id:h.id,icon:'🎉',label:cap(h.label),time:inf.time||'',bid:placeBld(inf.where),hour:EVHOUR[h.id]||9});}
 for(const w of DATA.weeklyEvents)if(w.seasons.includes(s)&&wd===w.day){const inf=DATA.holidayInfo[w.id]||{};out.push({id:w.id,icon:'📌',label:cap(w.label),time:inf.time||'',bid:placeBld(inf.where),hour:EVHOUR[w.id]||9});}
 const T=S.town;if(T&&y===T.nextYear){if(s==='Fall'&&ds===1)out.push({id:'election',icon:'🗳️',label:'Election Day',time:'Polls 7 AM to 8 PM',bid:placeBld('cityhall'),hour:7});if(s==='Summer'&&ds===1)out.push({id:'campaign',icon:'📣',label:'Mayoral candidates announce',time:'',bid:placeBld('cityhall'),hour:8});}
 for(const f of(S.funerals||[]))if(f.day===d&&!f.done){const p=P(f.pid);if(p)out.push({id:'funeral'+f.pid,icon:'🕯️',label:'Funeral for '+fullName(p),time:'1 to 3 PM',bid:f.b,hour:13});}

 return out;}

 const c=[1150,815];for(const p of living()){if(!p.act||!p.act.boat||p.trip||S.t<p.act.start)continue;const h=hash(p.id);const ang=(animNow()/1000)*0.05*(1+(h%5)/10)+(h%628)/100;const rr=55+(h%60);const bx=c[0]+Math.cos(ang)*rr*1.4,by=c[1]+Math.sin(ang)*rr*0.7;drawBoatAt(bx,by,p.act.boat,ang,true,p);}
 // swimmers near the beach
 if(cam.z>=1.1)for(const p of living()){if(!p.act||p.act.id!=='swim'||p.trip||S.t<p.act.start)continue;const h=hash(p.id);const s=P2(1175+(h%90),712+((h>>4)%18));cx.fillStyle=ensureLook(p).skin;cx.beginPath();cx.arc(s[0],s[1],Math.max(1.4,cam.z*0.9),0,7);cx.fill();cx.strokeStyle='rgba(255,255,255,0.7)';cx.lineWidth=1;cx.beginPath();cx.arc(s[0],s[1]+1,Math.max(2.4,cam.z*1.6),0,Math.PI);cx.stroke();}}
function drawBoatAt(x,y,type,ang,moving,p){const len=type==='pontoon'?14:type==='kayak'?7:type==='jetski'?6:10,wid=type==='pontoon'?6:type==='kayak'?2.2:3.6;const col=type==='kayak'?'#E0A23A':type==='jetski'?'#D33A32':'#F2F2F2';
 const dx=moving?-Math.sin(ang):1,dy=moving?Math.cos(ang)*0.5:0;const s=P2(x,y,0.5);cx.save();cx.translate(s[0],s[1]);cx.rotate(Math.atan2(dy,dx));const k=cam.z*0.9;cx.fillStyle=col;cx.beginPath();cx.moveTo(-len/2*k,-wid/2*k);cx.lineTo(len/2*k*0.7,-wid/2*k);cx.lineTo(len/2*k,0);cx.lineTo(len/2*k*0.7,wid/2*k);cx.lineTo(-len/2*k,wid/2*k);cx.closePath();cx.fill();cx.strokeStyle='rgba(0,0,0,0.25)';cx.lineWidth=0.8;cx.stroke();
 if(type==='pontoon'){cx.fillStyle='#2E4A7A';cx.fillRect(-len/2*k*0.6,-wid/2*k*0.8,len*k*0.8,wid*k*0.25);}
 if(p){cx.fillStyle=ensureLook(p).top.c;cx.beginPath();cx.arc(-len*k*0.1,0,Math.max(1.3,1.6*k*0.6),0,7);cx.fill();}
 if(moving&&!reduce()){cx.strokeStyle='rgba(255,255,255,0.6)';cx.lineWidth=1;cx.beginPath();cx.moveTo(-len/2*k,-wid*k*0.4);cx.lineTo(-len*k,-wid*k);cx.moveTo(-len/2*k,wid*k*0.4);cx.lineTo(-len*k,wid*k);cx.stroke();}cx.restore();}
/* ---- service and emergency vehicles ---- */
function loopPos(loop,f){let tot=0;const seg=[];for(let i=1;i<loop.length;i++){const l=Math.abs(loop[i][0]-loop[i-1][0])+Math.abs(loop[i][1]-loop[i-1][1]);seg.push(l);tot+=l;}let d=((f%1)+1)%1*tot;for(let i=1;i<loop.length;i++){if(d<=seg[i-1]){const k=d/seg[i-1];return[loop[i-1][0]+(loop[i][0]-loop[i-1][0])*k,loop[i-1][1]+(loop[i][1]-loop[i-1][1])*k,Math.sign(loop[i][0]-loop[i-1][0]),Math.sign(loop[i][1]-loop[i-1][1])];}d-=seg[i-1];}return[loop[0][0],loop[0][1],1,0];}
const LOOPS={mail:[[0,0],[1060,0],[1060,120],[0,120],[0,240],[1060,240],[1060,360],[0,360],[0,480],[750,480],[750,0]],trash:[[0,480],[0,0],[150,0],[150,480],[300,480],[300,0],[450,0],[450,480],[600,480],[600,0],[750,0],[750,480]],patrol:[[0,240],[750,240],[750,0],[0,0],[0,480],[750,480],[750,640],[1340,640],[1060,640],[1060,240]]};
function staffed(use,job){return(S._byUse[use]||[]).some(b=>S.biz[b]&&staffCount(S.biz[b],job));}
function drawServices(rt){const m=(rt%1440)/60,wd=Math.floor(rt/1440)%7;
 if(wd<5&&m>=8&&m<14&&staffed('postoffice','mail_carrier')){const q=loopPos(LOOPS.mail,(m-8)/6);carShape(q[0],q[1],[q[2],q[3]],'#E8ECF0',8,3.8);}
 if(wd===3&&m>=6&&m<12&&staffed('sanitation','sanit_worker')){const q=loopPos(LOOPS.trash,(m-6)/6);carShape(q[0],q[1],[q[2],q[3]],'#3E7A3A',11,4.4);}
 const pol=(S._byUse.police||[]).map(b=>S.biz[b])[0];if(pol){const on=(pol.staff.pol_officer||[]).map(P).filter(p=>p&&p.alive&&p.act&&p.act.id==='work'&&!p.trip).length;for(let i=0;i<Math.min(2,on);i++){const q=loopPos(LOOPS.patrol,(rt/300)+i*0.5);carShape(q[0],q[1],[q[2],q[3]],'#22355A',7.5,3.6);if(cam.z>1.2&&Math.floor(animNow()/400)%2){const s=P2(q[0],q[1],4.4);cx.fillStyle=i?'#D33A32':'#3A6FD3';cx.fillRect(s[0]-1.5,s[1]-1,3,2);}}}
 for(const c of(S._calls||[])){const a=S.blds[c.from],b=S.blds[c.to];if(!a||!b)continue;const dur=18,stay=70;const t=rt-c.t;if(t<0||t>dur+stay)continue;const r=route(a,b);const trip={t0:c.t,t1:c.t+dur,pts:r.pts,len:r.len};const xy=pathPos(trip,rt);const dir=segDir(trip,rt);
  const col=c.type==='fire'?'#C8302A':c.type==='police'?'#22355A':'#F2F2F2';carShape(xy[0],xy[1],dir,col,c.type==='fire'?12:9,4.2);if(t<dur&&Math.floor(animNow()/250)%2){const s=P2(xy[0],xy[1],4.6);cx.fillStyle=c.type==='police'?'#3A6FD3':'#D33A32';cx.fillRect(s[0]-2,s[1]-1.2,4,2.4);}}
 for(const f of(S.funerals||[])){if(f.day!==Math.floor(rt/1440)||m<12.4||m>13)continue;const a=S.blds[f.b],cem=(S._byUse.cemetery||[])[0];if(!a||!cem||!S.blds[cem])continue;const r=route(a,S.blds[cem]);const trip={t0:Math.floor(rt/1440)*1440+12.4*60,t1:Math.floor(rt/1440)*1440+13*60,pts:r.pts,len:r.len};const xy=pathPos(trip,rt);carShape(xy[0],xy[1],segDir(trip,rt),'#141414',10,3.8);}}
let _callN=0;function callSounds(){const n=(S._calls||[]).length;if(n>_callN&&S._calls[n-1]&&S.t-S._calls[n-1].t<5){SND.play('siren2');}_callN=n;}
/* ---- pet plan UI ---- */
function petPlanHTML(p){if(!petsOf(p).some(x=>x.kind==='dog'))return'';const pl=petPlanOf(p);const T=[[7,'7 AM'],[12,'Noon'],[18,'6 PM'],[21,'9 PM']];
 return`<p class="small muted">Walk times for ${petsOf(p).filter(x=>x.kind==='dog').map(x=>esc(x.name)).join(' and ')}</p><div class="chips">${T.map(([h,l])=>`<button class="chip ${pl.walk.includes(h)?'on':''}" data-pp="walk" data-h="${h}">${l}</button>`).join('')}</div>
 <label class="tog"><input type="checkbox" data-pp="walker" ${pl.walker?'checked':''}> Hire a dog walker for the midday walk</label><p class="small muted">${living().some(q=>q.job&&q.job.j==='self_dogwalker')?'Sprungfeld has a dog walker for hire.':'Nobody in town walks dogs for a living yet; the walk still happens, just without a visible walker.'}</p>`;}
body.addEventListener('click',e=>{const b=e.target.closest('[data-pp]');if(!b||b.tagName!=='BUTTON')return;const v=stack[stack.length-1];const p=v&&S.people[v.id];if(!p)return;const pl=petPlanOf(p);const h=+b.dataset.h;pl.walk=pl.walk.includes(h)?pl.walk.filter(x=>x!==h):pl.walk.concat([h]).sort((a,c)=>a-c);render();},true);

function drawLakeExtras0(){ for(const a of S.chunk.areas){if(a.kind==='sand'){path(a.poly,0);cx.fillStyle=(S.snow||0)>20?'rgba(240,244,250,0.9)':TH.dark?'#6E6248':'#E8D9A8';cx.fill();}
  if(a.kind==='cemetery'){path(a.poly,0);cx.fillStyle=TH.dark?'#2E3A2C':'#AFC49E';cx.fill();const n=Math.min(70,(S.graves||[]).length+18);const xs=a.poly.map(q=>q[0]),ys=a.poly.map(q=>q[1]);const x0=Math.min(...xs)+5,y0=Math.min(...ys)+6,W2=Math.max(...xs)-x0-5;
   if(cam.z>=0.9)for(let i=0;i<n;i++){const gx=x0+(i%10)*W2/10,gy=y0+Math.floor(i/10)*9;const s=P2(gx,gy,0),t=P2(gx,gy,2.4);cx.fillStyle=TH.dark?'#8E8A80':'#D8D4CA';cx.fillRect(s[0]-1.2*cam.z*0.6,t[1],2.4*cam.z*0.6,s[1]-t[1]);}}}
}

/* ======================= v0.7.1: live portraits ======================= */
function portraitScene(p){if(!p.alive)return{k:'grave'};if(p.trip)return{k:p.trip.mode==='car'?'car':p.trip.mode==='bike'?'bike':'walk'};
 if(p.act&&p.act.boat&&S.t>=p.act.start)return{k:'boat'};const A=p.act?(ACT[p.act.id]||DATA.sysActs[p.act.id]||{}):{};const pose=(p.act&&p.act.pose)||A.pose||'stand';const prop=p.act&&p.act.prop!==undefined?p.act.prop:A.prop;const id=p.act?p.act.id:'idle';
 let furn=null;if(pose==='lie')furn=id==='rough'?'bench':id==='hospital'?'cot':'bed';
 else if(pose==='sit'){furn=['tv','gaming','internet','cartoons','social_media','doomscroll','read','knit','puzzle','daydream','visit','host','sulk'].includes(id)?'sofa':['eat_home','eat_out','family_dinner','thanksgiving','date','app_date','coffee','board_games','cards','homework','bills','taxes','email','crossword','write','coupons'].includes(id)?'table':['drink_bar','drink_home','nye'].includes(id)?'stool':['work','wfh','school','study'].includes(id)?'desk':['church','funeral','movie','town_meeting'].includes(id)?'pew':'chair';}
 else if(pose==='stand'||pose==='bend'){furn=['cook','bake','dishes','snack','make_lunch','feed_pet'].includes(id)?'counter':['paint'].includes(id)?'easel':['shower','get_ready','clean_bath'].includes(id)?'bathtile':id==='work'&&prop==='pan'?'counter':null;}
 else if(pose==='tub')furn=null;else if(pose==='kneel'&&['garden','fix_leak','tinker','car_tinker','woodwork'].includes(id))furn='ground';
 return{k:'place',pose,prop,furn,emo:A.emo||'💭'};}
function pfurn(g,kind,x,yF,dark){const wood=dark?'#6A5848':'#B99B78',soft=dark?'#56657a':'#A8B6C8',metal=dark?'#5C6670':'#AEB6BD';
 if(kind==='bed'||kind==='cot'){g.fillStyle=wood;g.fillRect(x-8,yF-14,64,6);g.fillRect(x-8,yF-22,4,14);g.fillStyle=kind==='cot'?'#E8ECEF':soft;g.fillRect(x-6,yF-18,60,5);g.fillStyle=dark?'#ccc':'#fff';g.fillRect(x-5,yF-21,12,4);}
 if(kind==='bench'){g.fillStyle=wood;g.fillRect(x-8,yF-12,64,4);g.fillRect(x-4,yF-8,3,8);g.fillRect(x+48,yF-8,3,8);}
 if(kind==='sofa'){g.fillStyle=soft;g.fillRect(x-22,yF-13,44,9);g.fillRect(x-22,yF-26,44,10);g.fillRect(x-26,yF-20,6,16);g.fillRect(x+20,yF-20,6,16);}
 if(kind==='chair'||kind==='stool'){g.fillStyle=wood;g.fillRect(x-7,yF-12,14,3);g.fillRect(x-6,yF-12,2.5,12);g.fillRect(x+3.5,yF-12,2.5,12);if(kind==='chair')g.fillRect(x-7,yF-26,3,14);if(kind==='stool'){g.fillStyle=metal;g.fillRect(x+12,yF-30,30,4);g.fillRect(x+36,yF-30,4,30);}}
 if(kind==='table'){g.fillStyle=wood;g.fillRect(x-7,yF-12,14,3);g.fillRect(x-6,yF-12,2.5,12);g.fillRect(x+12,yF-21,30,3);g.fillRect(x+25,yF-21,3,21);}
 if(kind==='desk'){g.fillStyle=wood;g.fillRect(x-7,yF-12,14,3);g.fillRect(x-6,yF-12,2.5,12);g.fillRect(x+10,yF-22,34,22);g.fillStyle=dark?'#223':'#334';g.fillRect(x+20,yF-36,14,11);}
 if(kind==='pew'){g.fillStyle=wood;g.fillRect(x-24,yF-12,48,4);g.fillRect(x-24,yF-26,48,5);g.fillRect(x-22,yF-8,3,8);g.fillRect(x+19,yF-8,3,8);}
 if(kind==='counter'){g.fillStyle=wood;g.fillRect(x+6,yF-22,40,22);g.fillStyle=dark?'#777':'#8B8F86';g.fillRect(x+6,yF-24,40,3);}
 if(kind==='easel'){g.strokeStyle=wood;g.lineWidth=2;g.beginPath();g.moveTo(x+14,yF);g.lineTo(x+24,yF-46);g.lineTo(x+34,yF);g.stroke();g.fillStyle=dark?'#ddd':'#fff';g.fillRect(x+16,yF-44,16,20);}
 if(kind==='bathtile'){g.fillStyle=dark?'rgba(120,150,170,0.25)':'rgba(150,190,215,0.35)';for(let i=0;i<5;i++)for(let j=0;j<4;j++)g.fillRect(x-30+i*12,yF-60+j*12,10,10);}
 if(kind==='ground'){g.fillStyle=dark?'#3E5A3A':'#9DBB8B';g.fillRect(x-40,yF-3,80,3);}}
function drawPortrait(c,p,mini){if(!c||!p)return;const W=mini?46:116,Hh=mini?46:116;const dpr=Math.min(2,window.devicePixelRatio||1);if(c._w!==W){c.width=W*dpr;c.height=Hh*dpr;c.style.width=W+'px';c.style.height=Hh+'px';c._w=W;}
 const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,Hh);const dark=TH.dark;const sc=W/116;g.save();g.scale(sc,sc);
 g.fillStyle=dark?'#1E2622':'#ECEFE9';roundRect(g,1,1,114,114,18);g.fill();const yF=98,cxp=58;g.fillStyle=dark?'#2A332D':'#DCE3D8';g.fillRect(8,yF,100,3);
 const sc2=age(p)<3?1.2:age(p)<13?1.45:1.7;const sk=portraitScene(p);const bob=reduce()?0:Math.sin(animNow()/400+hash(p.id))*0.7;
 if(sk.k==='grave'){g.globalAlpha=0.35;figure(g,cxp-18,yF,sc2,'stand',null,p,0,dark);g.globalAlpha=1;g.fillStyle=dark?'#7E7A72':'#C9C4B8';g.beginPath();g.moveTo(cxp+6,yF);g.lineTo(cxp+6,yF-30);g.arc(cxp+20,yF-30,14,Math.PI,0);g.lineTo(cxp+34,yF);g.closePath();g.fill();g.fillStyle=dark?'#3A3830':'#6E6A62';g.font='700 9px "Barlow Semi Condensed",sans-serif';g.textAlign='center';g.fillText('R.I.P.',cxp+20,yF-26);g.fillText((p.first[0]||'')+'.'+(p.last[0]||'')+'.',cxp+20,yF-14);g.textAlign='left';}
 else if(sk.k==='car'){const col=p.car?p.car.color:'#888';g.fillStyle=col;roundRect(g,cxp-36,yF-26,72,18,5);g.fill();roundRect(g,cxp-20,yF-40,40,16,6);g.fill();g.fillStyle=dark?'#2B3640':'#BFD9EA';g.fillRect(cxp-15,yF-37,30,10);
  const lk=ensureLook(p);drawHead(g,cxp-4,yF-31,4.6,lk.skin,lk.hair,lk.hairC,lk.beard,lk.glasses,{id:'none'},age(p),p.sex);g.fillStyle='#1A1A1A';g.beginPath();g.arc(cxp-22,yF-6,7,0,7);g.arc(cxp+22,yF-6,7,0,7);g.fill();g.fillStyle='#888';g.beginPath();g.arc(cxp-22,yF-6,3,0,7);g.arc(cxp+22,yF-6,3,0,7);g.fill();}
 else if(sk.k==='bike'){g.strokeStyle=dark?'#ccc':'#333';g.lineWidth=2;g.beginPath();g.arc(cxp-16,yF-9,9,0,7);g.arc(cxp+16,yF-9,9,0,7);g.stroke();figure(g,cxp,yF-4,sc2*0.9,'walk',null,p,0,dark);}
 else if(sk.k==='walk'){figure(g,cxp,yF,sc2,'walk',null,p,0,dark);const dog=p.act&&p.act.pet&&S.pets&&S.pets[p.act.pet];if(dog){g.save();g.translate(cxp+28,yF);g.scale(1.3,1.3);drawPetFig(g,0,0,dog,dark);g.restore();}}
 else if(sk.k==='boat'){g.fillStyle=dark?'#2C4752':'#9CC3D2';g.fillRect(4,yF-6,108,12);g.fillStyle=p.act.boat==='kayak'?'#E0A23A':p.act.boat==='jetski'?'#D33A32':'#F2F2F2';g.beginPath();g.moveTo(cxp-40,yF-14);g.lineTo(cxp+40,yF-14);g.lineTo(cxp+30,yF-2);g.lineTo(cxp-32,yF-2);g.closePath();g.fill();figure(g,cxp-4,yF-12,sc2*0.85,'sit',null,p,bob,dark);}
 else{const ax=sk.pose==='lie'?cxp-24:sk.furn==='stool'||sk.furn==='table'||sk.furn==='desk'||sk.furn==='counter'||sk.furn==='easel'?cxp-16:cxp;if(sk.furn)pfurn(g,sk.furn,sk.pose==='lie'?ax-2:ax,yF,dark);
  figure(g,ax,sk.pose==='lie'?yF:yF-2,sc2,sk.pose,sk.prop,p,sk.pose==='lie'?0:bob,dark);
  if(!mini){g.font='16px sans-serif';g.textAlign='center';g.fillText(sk.emo,cxp+34,24);g.textAlign='left';}}
 g.restore();}
function portraitTick(){if(sheet.hidden)return;const v=stack[stack.length-1];if(!v)return;if(v.type==='person'){drawPortrait($('#portrait'),S.people[v.id],false);}
 if(v.type==='favs'||v.type==='person'||v.type==='building'||v.type==='town')body.querySelectorAll('canvas.miniport').forEach(c=>drawPortrait(c,S.people[c.dataset.pid],true));}
function portraitTap(p){if(!p)return;if(!p.alive){toast(fullName(p)+' rests at '+((S._byUse.cemetery||[]).length?'Sprungfeld Cemetery':'the churchyard')+'.');return;}if(p.trip){focusPerson(p);toast(p.first+' is on the way to '+bName(S.blds[p.trip.to])+'.');return;}if(p.act&&p.act.boat){cam.tx=1150;cam.ty=815;toast(p.first+' is out on Lake Sprung.');return;}if(p.loc)openBuilding(p.loc);}
body.addEventListener('click',e=>{const b=e.target.closest('[data-portrait]');if(!b)return;e.stopPropagation();portraitTap(S.people[b.dataset.portrait]);},true);
